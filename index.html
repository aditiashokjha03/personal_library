
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Management App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sidebar">
    <h3>Add Book</h3>
    <input id="title" placeholder="Title">
    <input id="author" placeholder="Author">
    <input id="price" placeholder="Price">
    <input id="imageURL" placeholder="Image URL">
    <button id="addBtn" onclick="addBook()">Add Book</button>
  </div>

  <div class="main">
    <h1>📚 My Book Collection</h1>
    <div id="bookList" class="book-container"></div>
  </div>

  <!-- Modal Overlay -->
  <div id="detailsModal" class="modal-overlay">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <img id="modalImage" src="" alt="Cover">
      <h2 id="modalTitle">Book Title</h2>
      <p id="modalAuthor">Author: </p>
      <p id="modalPrice">Price: </p>
    </div>
  </div>

  <script type="module" src="JS/crud.js"></script>
</body>
</html>
